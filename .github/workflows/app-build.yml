# =============================================================================
# NonaShield Demo App — Build APK
# =============================================================================
#
# The ONLY workflow that builds the demo app. One app, one tenant: the SDK is configured with
# tenantId = "dimeai" in DiimeApp.kt (checked below) and the demo API key defaults to the one in
# app/build.gradle, so every APK from this repo is built the same way. (A second workflow,
# build-apk.yml, used to build the same app with a different API key; it was removed.)
#
# Triggers on push to main when app source files change.
# Steps:
#   1. Check out demo app repo
#   2. Build debug APK — SDK AAR resolved from app/libs/ (flatDir, no SDK source needed)
#   3. Upload APK as a GitHub Actions artifact
#
# The SDK AAR (app/libs/android-sdk-release.aar) is committed to this
# repo. To update the SDK: download the new AAR from the nonashield-sdk CI
# artifacts and replace the file, then commit.
#
# Optional secrets (for Play Store / signed release builds):
#   DIIMEAI_KEYSTORE_BASE64  — base64-encoded keystore (base64 -w0 diimeai.keystore)
#   DIIMEAI_STORE_PASSWORD   — keystore password
#   DIIMEAI_KEY_ALIAS        — key alias
#   DIIMEAI_KEY_PASSWORD     — key password
# =============================================================================

name: Build App

on:
  # Manual only: nothing starts on a push, pull request, schedule or tag. Run it from the Actions tab (branch demo or main).
  workflow_dispatch:
    inputs:
      distribute:
        description: "Upload the signed demo APK to Firebase App Distribution"
        type: boolean
        default: false
      group:
        description: "Firebase tester group alias"
        type: string
        default: "dimeai-testers"
      release_notes:
        description: "Release notes shown to testers"
        type: string
        default: "NonaShield demo build"

concurrency:
  group: app-build
  cancel-in-progress: true

jobs:

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Verify the demo defaults to the DIMEAI tenant
        run: |
          if ! grep -qE 'tenantId\s*=\s*"dimeai"' app/src/main/java/com/diimeai/demo/DiimeApp.kt; then
            echo "✗ DiimeApp.kt must configure the SDK with tenantId = \"dimeai\""
            exit 1
          fi
          echo "✓ SDK tenant: dimeai"

      - name: Build debug APK
        env:
          DEMO_API_KEY: "ABCDEFGHI"
        run: |
          chmod +x gradlew
          echo "── Building APK (SDK AAR from app/libs/, DEMO_API_KEY=ABCDEFGHI)..."
          ./gradlew :app:assembleDebug \
            --warning-mode none \
            --no-daemon
          echo "✓ APK built"

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK" ]]; then
            echo "✗ APK not found at $APK"
            ls -la app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "✓ APK: $APK (${SIZE} bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonashield-demo-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── Tester build: the `demo` flavor, signed with the keystore in the DIIMEAI_* secrets ──
      # Same applicationId as release (com.nonashield.app). Fails, never falls back to an unsigned or
      # debug-signed file, when a signing secret is missing.
      - name: Build signed demo APK (tester build)
        env:
          DEMO_API_KEY: "ABCDEFGHI"
          DIIMEAI_KEYSTORE_BASE64: ${{ secrets.DIIMEAI_KEYSTORE_BASE64 }}
          DIIMEAI_STORE_PASSWORD:  ${{ secrets.DIIMEAI_STORE_PASSWORD }}
          DIIMEAI_KEY_ALIAS:       ${{ secrets.DIIMEAI_KEY_ALIAS }}
          DIIMEAI_KEY_PASSWORD:    ${{ secrets.DIIMEAI_KEY_PASSWORD }}
        run: |
          for v in DIIMEAI_KEYSTORE_BASE64 DIIMEAI_STORE_PASSWORD DIIMEAI_KEY_ALIAS DIIMEAI_KEY_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "::error::$v is not set (non-empty). The tester APK is never built unsigned."
              exit 1
            fi
          done
          KS="$RUNNER_TEMP/diimeai.keystore"
          echo "$DIIMEAI_KEYSTORE_BASE64" | base64 -d > "$KS"
          export DIIMEAI_KEYSTORE_PATH="$KS"
          # Backend certificate pins (leaf, Let's Encrypt intermediate, ISRG root): the same three as in DiimeApiClient.kt.
          ./gradlew :app:assembleDemo             "-PnonashieldCertPins=sha256/DNUBm2e3pjQxpmeLywECXQohfN2Z+fuGWkqt/oiBAVA=,sha256/brzvtCELCIZUo4sD/qPX0ccRtPsd3DY6RfmxpOU9oB4=,sha256/diGVwiVYbubAI3RW4hB9xU8e/CH2GnkuvVFZE8zmgzI="             --warning-mode none --no-daemon
          rm -f "$KS"

      - name: Verify the demo APK signature
        id: demo_apk
        run: |
          APK="app/build/outputs/apk/demo/app-demo.apk"
          [[ -f "$APK" ]] || { echo "::error::$APK not found"; ls -la app/build/outputs/apk/ || true; exit 1; }
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          # apksigner exits non-zero when the signature is invalid; its WARNING lines about META-INF entries are noise.
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt" 2>&1
          grep -v "^WARNING:" "$RUNNER_TEMP/certs.txt"
          # The DIMEAI demo keystore's certificate (also PAYSHIELD_DEMO_CERT_HASH in nonashield-sdk). A rotated key must be changed here.
          EXPECTED="bc2af556eaefc76caee9450ca938b858444af73c4cc096272611b3381485ca06"
          GOT="$(grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')"
          if [[ "$GOT" != "$EXPECTED" ]]; then
            echo "::error::The APK is signed with certificate '$GOT', not the DIMEAI demo certificate $EXPECTED."
            exit 1
          fi
          echo "APK signed with the DIMEAI demo certificate"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload demo APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nonashield-demo-signed-apk-${{ github.sha }}
          path: app/build/outputs/apk/demo/app-demo.apk
          retention-days: 30
          if-no-files-found: error

      - name: Distribute to Firebase App Distribution
        if: ${{ inputs.distribute }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID_DEMO: ${{ secrets.FIREBASE_APP_ID_DEMO }}
          GROUP: ${{ inputs.group }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          for v in FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_APP_ID_DEMO; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set"; exit 1; }
          done
          SA="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          npx --yes firebase-tools@13.29.1 appdistribution:distribute "${{ steps.demo_apk.outputs.apk }}"             --app "$FIREBASE_APP_ID_DEMO" --groups "$GROUP" --release-notes "$NOTES"
          rm -f "$SA"

      - name: Print build summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════"
          echo "  App Build Summary"
          echo "════════════════════════════════════════════"
          echo "  Commit    : ${{ github.sha }}"
          echo "  Branch    : ${{ github.ref_name }}"
          echo "  By        : ${{ github.actor }}"
          echo "  API Key   : ABCDEFGHI (embedded in APK)"
          echo "  API URL   : https://api.diimeai.com"
          echo "  Artifact  : nonashield-demo-apk-${{ github.sha }}"
          echo "════════════════════════════════════════════"
